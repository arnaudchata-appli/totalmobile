name: Appli Android (APK)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Dépendances
        run: npm install --no-audit --no-fund

      - name: Préparer le projet Android
        run: |
          node scripts/copy-www.js
          npx cap add android
          npx capacitor-assets generate --android
          # écran en paysage
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
          # numéro de version = numéro du build
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          npx cap sync android

      - name: Compiler l'APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cd android
          chmod +x gradlew
          if [ -n "$KS_B64" ]; then
            ./gradlew assembleRelease --no-daemon
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KS_PASS --ks-key-alias "$KS_ALIAS" \
              --out "$GITHUB_WORKSPACE/FrontDAcier.apk" "$RUNNER_TEMP/aligned.apk"
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/FrontDAcier.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: FrontDAcier-apk
          path: FrontDAcier.apk

      - name: Publier dans la release « android-latest »
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest FrontDAcier.apk \
            --title "Front d'Acier – appli Android (build ${{ github.run_number }})" \
            --notes "APK construit automatiquement depuis le commit ${{ github.sha }}. Téléchargez FrontDAcier.apk sur votre téléphone Android et ouvrez-le pour l'installer (autorisez l'installation depuis cette source si demandé)." \
            --target ${{ github.sha }} --latest
